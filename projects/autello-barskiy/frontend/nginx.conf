server {
    listen 80;
    server_name _;

    # Статика фронта — раздаётся из /usr/share/nginx/html (сюда Dockerfile кладёт dist/).
    root /usr/share/nginx/html;
    index index.html;

    # Обычная раздача + fallback на index.html — задел для SPA-роутинга.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Все /api/* уходят на backend-контейнер по имени в shared docker-сети.
    # Слеш в конце proxy_pass СРЕЗАЕТ префикс /api:
    # запрос /api/applications → backend получит /applications (без /api).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger открыт для разработки/сдачи. В прод-админке (VPh06) закроем под авторизацию.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
