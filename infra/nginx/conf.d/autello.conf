server {
    listen 80;
    server_name autello.otiva.ru;

    # Проксируем всё в контейнер autello-web,
    # который сам разбирается: статика vs /api vs /docs
    location / {
        proxy_pass http://autello-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
