# HTTP: ACME-challenge + редирект на HTTPS
server {
    listen 80;
    server_name registry.otiva.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: проксирование в Docker Registry
server {
    listen 443 ssl;
    http2 on;
    server_name registry.otiva.ru;

    ssl_certificate /etc/letsencrypt/live/autello.otiva.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autello.otiva.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Большие docker-образы: отключаем лимит и таймауты
    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        # Поддержка Docker Registry v2
        proxy_pass http://infra-registry:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }
}
