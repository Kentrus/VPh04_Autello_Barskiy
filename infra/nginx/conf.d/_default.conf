server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        default_type text/plain;
        return 200 'Infra platform is running.\nReady for projects.\n';
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
